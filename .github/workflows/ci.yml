name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the runtime the production image runs (Dockerfile_eks: node:20-bookworm)
          # and package.json "engines". mocha 6 does not run on Node >= 23.
          node-version: '20'
      - run: npm install
      # Custody-path dependency floors (node-forge >= 1.4.0, rsa-threshold-signatures >= 2.0.0)
      - run: npm run check:deps
      - run: npm run lint
      - run: npm run test:unit
      # Integration tests spin up a WAX chain via qtest-js (Docker). Pre-pull the
      # chain image (~1.7 GB) in its own step so the download isn't counted
      # against the tests' mocha timeout on a cold runner — the cause of earlier
      # CI failures. If anonymous Docker Hub pulls get rate-limited, add a
      # docker/login-action step using repo secrets before this.
      - name: Pre-pull qtest chain image
        run: docker pull songmai108/qtest:v4.0.4
      - run: npm run test:integration
